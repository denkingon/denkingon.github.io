<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>denkingon</title>
<meta name="description" content="denkingon のポートフォリオ。作品は近日ここに並びます。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='8' y='8' width='84' height='84' rx='14' fill='%238b4a38'/%3E%3Ctext x='50' y='68' font-size='52' font-family='serif' fill='%23f5efe1' text-anchor='middle'%3Ed%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg:         #f5efe1;   /* kozo — 楮和紙 */
    --bg-elev:    #fbf6ea;   /* gampi */
    --text:       #262220;   /* sumi */
    --text-soft:  #605850;   /* sumi-yo */
    --text-faint: #a09889;   /* usuzumi */
    --border:     #e6dfce;   /* asahaku */
    --accent:     #8b4a38;   /* bengara */
    --seal-ink:   #f5efe1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:         #1a1612;   /* sumi */
      --bg-elev:    #221d18;   /* kuro-cha */
      --text:       #e8dfd0;   /* washi-aka */
      --text-soft:  #9a948a;   /* senbi */
      --text-faint: #6a6258;   /* asagiri */
      --border:     #3a342c;   /* kasumi */
      --accent:     #b06850;   /* bengara (明) */
      --seal-ink:   #1a1612;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 2rem 1.5rem;
  }

  main {
    max-width: 34rem;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 2.2rem;
  }

  .seal {
    width: 3rem;
    height: 3rem;
    border-radius: 0.55rem;
    background: var(--accent);
    color: var(--seal-ink);
    display: grid;
    place-items: center;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    font-size: 1.6rem;
    font-weight: 600;
    transform: rotate(-3deg);
    user-select: none;
  }

  header { display: flex; flex-direction: column; gap: 1.1rem; }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    color: var(--text-faint);
    text-transform: uppercase;
  }

  h1 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    font-size: clamp(2.5rem, 8vw, 3.5rem);
    font-weight: 600;
    letter-spacing: 0.01em;
    text-wrap: balance;
    line-height: 1.2;
  }

  .lede {
    font-size: 0.95rem;
    line-height: 2;
    color: var(--text-soft);
    max-width: 30rem;
  }

  hr {
    border: none;
    border-top: 1px solid var(--border);
  }

  footer {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    font-size: 0.78rem;
    color: var(--text-faint);
  }

  footer a {
    color: var(--text-soft);
    text-decoration: none;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.1em;
    transition: color 0.2s, border-color 0.2s;
  }
  footer a:hover, footer a:focus-visible {
    color: var(--accent);
    border-color: var(--accent);
  }
  footer a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  @media (prefers-reduced-motion: no-preference) {
    main {
      animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.3, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(0.6rem); }
      to   { opacity: 1; transform: none; }
    }
  }
</style>
</head>
<body>
<main>
  <div class="seal" aria-hidden="true">d</div>
  <header>
    <p class="eyebrow">Portfolio</p>
    <h1>denkingon</h1>
  </header>
  <p class="lede">ポートフォリオサイトを準備中です。作品とプロジェクトは、近日このページに並びます。URLはこのまま変わりません。</p>
  <hr>
  <footer>
    <span>© 2026 denkingon</span>
    <a href="https://github.com/denkingon">GitHub</a>
  </footer>
</main>
</body>
</html>
