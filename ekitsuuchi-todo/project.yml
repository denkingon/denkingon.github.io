# XcodeGen spec -> EkiTsuuchi.xcodeproj (生成物。git には入れない)。
# 生成: `xcodegen generate`（scripts/bootstrap.sh がやる）。CI の macOS ジョブでだけ iOS 層がコンパイルされる。
name: EkiTsuuchi

options:
  bundleIdPrefix: dev.denkingon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# ビルド設定の持ち分け:
#  - ここ: 構成によらない設定（project / target の設定は xcconfig より強いので、同じキーを xcconfig に書かない）
#  - Config/*.xcconfig: PLACES_API_KEY（秘密）と構成ごとの差
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone のみ
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM はここに書かない: project の設定は xcconfig より強く、`xcodegen generate` のたびに
    # Xcode で選んだ Team も消える。Config/Secrets.xcconfig（git 管理外）に書く（README 参照）。
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  EkiCore:
    path: .          # ekitsuuchi-todo/Package.swift（Core はここだけ。外部依存なし）

targets:
  EkiTsuuchi:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: EkiCore
        product: EkiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.denkingon.ekitsuuchi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"    # Info.plist は下の info: から生成する
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: 駅通知todo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # BGAppRefresh 用。領域監視（ジオフェンス）自体にはバックグラウンドモードは要らない。
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - dev.denkingon.ekitsuuchi.refresh
        ITSAppUsesNonExemptEncryption: false
        # Config/Secrets.xcconfig の PLACES_API_KEY が入る。無ければ空（AppSecrets が "" を返す）。
        PlacesAPIKey: $(PLACES_API_KEY)
        # 位置情報の理由文。計画書 §2: App Store 審査の理由文はアプリ内（設定画面）の文言と一致させる。
        # 設定画面はこの一文をそのまま使うこと（下の2キーも同じ文）:
        #   使う駅に入った瞬間をバックグラウンドでも検知し、その駅の近くで開いている店のタスクをお知らせするために、位置情報を「常に」使います。
        NSLocationWhenInUseUsageDescription: 使う駅に入った瞬間をバックグラウンドでも検知し、その駅の近くで開いている店のタスクをお知らせするために、位置情報を「常に」使います。
        NSLocationAlwaysAndWhenInUseUsageDescription: 使う駅に入った瞬間をバックグラウンドでも検知し、その駅の近くで開いている店のタスクをお知らせするために、位置情報を「常に」使います。

  # UI テスト（XCUITest）。CI の macOS ジョブが Simulator で実際にアプリを起動して触る（.github/workflows/ekitsuuchi-ci.yml）。
  # 署名なし（CODE_SIGNING_ALLOWED=NO）・Secrets.xcconfig なし・外部通信なしで通る作り。
  EkiTsuuchiUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: EkiTsuuchi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.denkingon.ekitsuuchi.uitests
        TEST_TARGET_NAME: EkiTsuuchi     # 対象のアプリ（XcodeGen も dependencies から補うが明示しておく）
        GENERATE_INFOPLIST_FILE: "YES"   # テスト用バンドルは Info.plist を自動生成させる（アプリ側は info: から生成）

schemes:
  EkiTsuuchi:
    build:
      targets:
        EkiTsuuchi: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
    # UI テストをスキームのテスト項目に入れる（`xcodebuild test -scheme EkiTsuuchi`）。
    test:
      config: Debug
      targets:
        - EkiTsuuchiUITests
